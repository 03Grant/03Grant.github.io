<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  <link rel="icon" href="{{ '/images/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "{{ site.author.name }}",
    "url": "{{ site.url }}/",
    "image": "{{ site.logo | absolute_url }}",
    "jobTitle": "PhD student in Computer Science",
    "email": "mailto:{{ site.author.email }}",
    "affiliation": { "@type": "CollegeOrUniversity", "name": "Purdue University", "url": "https://www.cs.purdue.edu/" },
    "alumniOf": { "@type": "CollegeOrUniversity", "name": "Tongji University" },
    "sameAs": [ "{{ site.author.github }}"{% if site.author.linkedin %}, "{{ site.author.linkedin }}"{% endif %}{% if site.author.scholar %}, "{{ site.author.scholar }}"{% endif %} ]
  }
  </script>
</head>
<body>
  <nav class="nav">
    <a href="{{ '/' | relative_url }}"{% if page.url == "/" %} class="current"{% endif %}>Home</a>
    <a href="{{ '/#publications' | relative_url }}">Publications</a>
    <a href="{{ '/cv/' | relative_url }}"{% if page.url == "/cv/" %} class="current"{% endif %}>CV</a>
  </nav>
  <main class="page">
{{ content }}
  </main>
  <footer class="footer">
    © {{ site.time | date: "%Y" }} {{ site.author.name }} · Last updated {{ site.time | date: "%B %Y" }} · <a href="https://github.com/03Grant/03Grant.github.io">Source</a>
  </footer>
</body>
</html>
