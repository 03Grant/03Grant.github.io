# Site settings. GitHub Pages builds this with its native Jekyll; no theme, no plugins.
title: Yinghao He
description: Yinghao He, PhD student in Computer Science at Purdue University
tagline: PhD student in Computer Science at Purdue University
url: https://03grant.github.io
baseurl: ""
lang: en
logo: /images/photo.jpg

# Both plugins are in GitHub Pages' native build: sitemap.xml and the SEO tags in <head>.
plugins:
  - jekyll-sitemap
  - jekyll-seo-tag

author:
  name: Yinghao He
  email: he923@purdue.edu
  github: https://github.com/03Grant
  scholar:            # Google Scholar profile URL; the header shows a link once this is set
  photo: /images/photo.jpg   # leave empty for the no-photo layout

collections:
  publications:
    output: false     # listed on the home page and the CV page; no page per paper

markdown: kramdown
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
